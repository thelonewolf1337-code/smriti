[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smriti-memory"
version = "0.3.0"
description = "Smriti — portable memory + self-improvement loop for AI agents (framework-agnostic, MCP server)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ankesh" }]
keywords = ["ai", "agents", "memory", "mcp", "self-improvement"]

[project.optional-dependencies]
mcp = ["mcp>=1.0.0"]
dev = ["pytest>=8.0"]

[project.scripts]
smriti-mcp = "smriti.server:main"

[tool.setuptools.packages.find]
where = ["src"]
